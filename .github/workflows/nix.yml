name: nix

on:
  push:
    branches: [nixos, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk, removing the toolcache that actions/setup-* needs
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            max-jobs = auto

      - name: Scan the history for secrets
        run: nix shell --no-update-lock-file --inputs-from . nixpkgs#gitleaks nixpkgs#trufflehog nixpkgs#sops nixpkgs#age nixpkgs#jq -c bash tests/secrets-repo.sh

      - name: Evaluate flake
        run: nix flake check --no-build --no-update-lock-file -L

      - name: Build toplevel
        run: |
          nix build --no-update-lock-file -L --no-link --print-out-paths .#nixosConfigurations.homelab.config.system.build.toplevel
          nix path-info --no-update-lock-file -Sh .#nixosConfigurations.homelab.config.system.build.toplevel
