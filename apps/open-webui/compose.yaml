services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:096c8f3d3132016210ca87b0b4dff01d2d66d9fe4fee088fae13fc30f9ac54f3
    container_name: open-webui
    volumes:
      - ${HOMELAB_DATA_DIR:?}/open-webui/app/backend/data:/app/backend/data
    restart: always
    env_file:
      - ${HOMELAB_SECRETS_DIR:?}/open-webui.env
    environment:
      WEBUI_URL: https://open-webui.${CADDY_DOMAIN:?}
      ENABLE_OAUTH_SIGNUP: "false"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_CLIENT_ID: open-webui
      OAUTH_PROVIDER_NAME: Pocket ID
      OPENID_PROVIDER_URL: https://id.${CADDY_DOMAIN:?}/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://open-webui.${CADDY_DOMAIN:?}/oauth/oidc/callback
      OAUTH_SCOPES: openid email profile
    networks:
      - homelab-network
