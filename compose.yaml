services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - .data/caddy/srv:/srv
      - .data/caddy/data:/data
      - .data/caddy/config:/config
    environment:
      DOMAIN: ${CADDY_DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CADDY_CLOUDFLARE_API_TOKEN}
      HOST_MACHINE_HOSTNAME: ${CADDY_HOST_MACHINE_HOSTNAME}
    networks:
      - homelab-network
      - authentik-network

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    volumes:
      - .data/jellyfin/config:/config
      - .data/jellyfin/cache:/cache
      - /data/media/:/media
    restart: always
    runtime: nvidia
    environment:
      PUID: 1000
      PGID: 1000
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    networks:
      - homelab-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - .data/open-webui/app/backend/data:/app/backend/data
    restart: always
    networks:
      - homelab-network

  authentik-postgresql:
    container_name: authentik-postgresql
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
      - authentik-database:/var/lib/postgresql/data
    networks:
      - authentik-network

  authentik-redis:
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      timeout: 3s
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    volumes:
      - authentik-redis:/data
    networks:
      - authentik-network

  authentik-server:
    container_name: authentik-server
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/goauthentik/server:2025.8.4
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    restart: unless-stopped
    volumes:
      - ./.authentik/media:/media
      - ./.authentik/custom-templates:/templates
      - /etc/homelab-ca/certs:/etc/ssl/certs:ro
    networks:
      - authentik-network

  authentik-worker:
    container_name: authentik-worker
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/goauthentik/server:2025.8.4
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    restart: unless-stopped
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.authentik/media:/media
      - ./.authentik/certs:/certs
      - ./.authentik/custom-templates:/templates
      - /etc/homelab-ca/certs:/etc/ssl/certs:ro
    networks:
      - authentik-network

  authentik-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: authentik-cloudflared
    restart: unless-stopped
    command: tunnel run
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      authentik-network:
        gw_priority: 10
      local-network:
        gw_priority: 100
    environment:
      TUNNEL_TOKEN: ${AUTHENTIK_CLOUDFLARE_TUNNEL_TOKEN}

  adguard-init:
    image: alpine
    container_name: adguardhome-init
    command:
      - sh
      - -euc
      - |
        : "$${ADGUARD_USER:?missing from .env}"
        : "$${ADGUARD_PASSWORD_HASH:?missing from .env}"
        sed -e "s|__ADGUARD_USER__|$${ADGUARD_USER}|g" \
            -e "s|__ADGUARD_PASSWORD_HASH__|$${ADGUARD_PASSWORD_HASH}|g" \
            /src/AdGuardHome.yaml > /dst/AdGuardHome.yaml
        if grep -q '__ADGUARD_' /dst/AdGuardHome.yaml; then
          echo "error: unsubstituted placeholder remains" >&2; exit 1
        fi
        echo "rendered AdGuardHome.yaml"
    environment:
      ADGUARD_USER: ${ADGUARD_USER}
      ADGUARD_PASSWORD_HASH: ${ADGUARD_PASSWORD_HASH}
    volumes:
      - ./config/adguardhome:/src:ro
      - .data/adguardhome/conf:/dst

  adguard:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    depends_on:
      adguard-init:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - .data/adguardhome/work:/opt/adguardhome/work
      - .data/adguardhome/conf:/opt/adguardhome/conf
      - /etc/homelab-ca/certs:/etc/ssl/certs:ro

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/prowlarr:/config
      - /etc/homelab-ca/certs:/etc/ssl/certs:ro
    restart: unless-stopped
    networks:
      - homelab-network

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/sonarr:/config
      - /data/media/shows:/shows
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/radarr:/config
      - /data/media/movies:/movies
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/bazarr:/config
      - /data/media/movies:/movies
      - /data/media/shows:/shows
      - /etc/homelab-ca/certs:/etc/ssl/certs:ro
    restart: unless-stopped
    networks:
      - homelab-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8080
    volumes:
      - .data/qbittorrent:/config
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  qui:
    image: ghcr.io/autobrr/qui:main
    container_name: qui
    volumes:
      - .data/qui:/config
    networks:
      - homelab-network

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest 
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Toronto
    volumes:
      - .data/jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
      - homelab-network

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: true
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - seafile-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    networks:
      - seafile-network

  seafile-redis:
    image: redis:7-alpine
    container_name: seafile-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SEAFILE_REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SEAFILE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seafile-network

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    volumes:
      - ${SEAFILE_DATA_PATH:-/data/seafile}:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: 3306
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${SEAFILE_MYSQL_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: America/Toronto
      INIT_SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: seafile.${CADDY_DOMAIN}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: false
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: false
      ENABLE_GO_FILESERVER: true
      ENABLE_SEADOC: true
      SEADOC_SERVER_URL: https://seafile.${CADDY_DOMAIN}/sdoc-server
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SEAFILE_REDIS_PASSWORD}
      ENABLE_NOTIFICATION_SERVER: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
    networks:
      - seafile-network
      - homelab-network

  seadoc:
    image: seafileltd/sdoc-server:2.0-latest
    container_name: seadoc
    restart: unless-stopped
    volumes:
      - .data/seadoc:/shared
    environment:
      DB_HOST: seafile-db
      DB_PORT: 3306
      DB_USER: seafile
      DB_PASSWORD: ${SEAFILE_MYSQL_PASSWORD}
      DB_NAME: seahub_db
      TIME_ZONE: America/Toronto
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY}
      NON_ROOT: false
      SEAHUB_SERVICE_URL: http://seafile
    depends_on:
      seafile-db:
        condition: service_healthy
    networks:
      - seafile-network
      - homelab-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    env_file: .env
    depends_on:
      - tempo
      - loki
    networks:
      - homelab-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file", "/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    networks:
      - homelab-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks:
      - homelab-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file", "/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    networks:
      - homelab-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki
    networks:
      - homelab-network

  grafana-funnel:
    image: tailscale/tailscale:latest
    container_name: tailscale-funnel
    restart: unless-stopped
    hostname: otel-funnel
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - grafana-funnel:/var/lib/tailscale
      - ./config/tailscale-serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - homelab-network

  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz-clickhouse-scripts:/var/lib/clickhouse/user_scripts
    networks:
      - signoz-network

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper
    restart: unless-stopped
    user: root
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    volumes:
      - signoz-zookeeper:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      signoz-network:
        aliases:
          - zookeeper-1

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-clickhouse
    restart: unless-stopped
    tty: true
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    volumes:
      - ./config/signoz/clickhouse-config.xml:/etc/clickhouse-server/config.xml:ro
      - ./config/signoz/clickhouse-users.xml:/etc/clickhouse-server/users.xml:ro
      - ./config/signoz/clickhouse-custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./config/signoz/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - signoz-clickhouse-scripts:/var/lib/clickhouse/user_scripts
      - signoz-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      signoz-network:
        aliases:
          - clickhouse

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_VERSION:-v0.144.8}
    container_name: signoz-telemetrystore-migrator
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    networks:
      - signoz-network

  signoz:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.138.0}
    container_name: signoz
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET}
    volumes:
      - signoz-sqlite:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - signoz-network
      - homelab-network

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_VERSION:-v0.144.8}
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./config/signoz/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
      - ./config/signoz/otel-collector-opamp.yaml:/etc/manager-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      # Grafana-stack otel-collector still holds 4317/4318; these move over
      # once that stack is retired.
      - "4327:4317"
      - "4328:4318"
    networks:
      - signoz-network
      - homelab-network

volumes:
  seafile-database:
    driver: local
  authentik-database:
    driver: local
  authentik-redis:
    driver: local
  tempo:
    driver: local
  prometheus:
    driver: local
  loki:
    driver: local
  grafana:
    driver: local
  grafana-funnel:
    driver: local
  signoz-clickhouse:
    driver: local
  signoz-clickhouse-scripts:
    driver: local
  signoz-zookeeper:
    driver: local
  signoz-sqlite:
    driver: local

networks:
  seafile-network:
    driver: bridge
  authentik-network:
    driver: bridge
  signoz-network:
    driver: bridge
  homelab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  local-network:
    driver: macvlan
    driver_opts:
      parent: eno1
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1
          ip_range: 10.0.0.240/29
