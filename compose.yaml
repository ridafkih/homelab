services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - .data/caddy/srv:/srv
      - .data/caddy/data:/data
      - .data/caddy/config:/config
    environment:
      DOMAIN: ${CADDY_DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CADDY_CLOUDFLARE_API_TOKEN}
      HOST_MACHINE_HOSTNAME: ${CADDY_HOST_MACHINE_HOSTNAME}
    networks:
      - homelab-network

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    volumes:
      - .data/jellyfin/config:/config
      - .data/jellyfin/cache:/cache
      - /data/media/:/media
    restart: always
    runtime: nvidia
    environment:
      PUID: 1000
      PGID: 1000
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    networks:
      - homelab-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    volumes:
      - .data/ollama/root/.ollama:/root/.ollama
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH}
      OLLAMA_KEEP_ALIVE: -1
    networks:
      - homelab-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - .data/open-webui/app/backend/data:/app/backend/data
    restart: always
    networks:
      - homelab-network

  authentik-postgresql:
    container_name: authentik-postgresql
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
      - authentik-database:/var/lib/postgresql/data
    networks:
      - authentik-network

  authentik-redis:
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - redis-cli ping | grep PONG
      timeout: 3s
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    volumes:
      - authentik-redis:/data
    networks:
      - authentik-network

  authentik-server:
    container_name: authentik-server
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/goauthentik/server:2025.8.4
    restart: unless-stopped
    volumes:
      - ./.authentik/media:/media
      - ./.authentik/custom-templates:/templates
    networks:
      - authentik-network

  authentik-worker:
    container_name: authentik-worker
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/goauthentik/server:2025.8.4
    restart: unless-stopped
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.authentik/media:/media
      - ./.authentik/certs:/certs
      - ./.authentik/custom-templates:/templates
    networks:
      - authentik-network

  authentik-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: authentik-cloudflared
    restart: unless-stopped
    command: tunnel run
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - authentik-network
    environment:
      TUNNEL_TOKEN: ${AUTHENTIK_CLOUDFLARE_TUNNEL_TOKEN}

  adguard:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - 53:53/udp
      - 53:53/tcp
      - 67:67/udp
      - 68:68/tcp
      - 68:68/udp
      - 443:443/udp
      - 784:784/udp
      - 853:853/tcp
      - 853:853/udp
      - 8853:8853/udp
      - 5443:5443/tcp
      - 5443:5443/udp
    networks:
      - homelab-network
    volumes:
      - .data/adguardhome/work:/opt/adguardhome/work
      - .data/adguardhome/conf:/opt/adguardhome/conf

  kasa:
    container_name: kasa
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:debian
        RUN apt-get update && apt-get install -y iproute2 iputils-ping tzdata && rm -rf /var/lib/apt/lists/*
        RUN uv pip install --system --break-system-packages python-kasa tzdata
        RUN echo '#!/bin/sh' > /entrypoint.sh && \
            echo 'ip route del default 2>/dev/null || true' >> /entrypoint.sh && \
            echo 'ip route add default via 192.168.2.1 dev eth0' >> /entrypoint.sh && \
            echo 'exec kasa "$@"' >> /entrypoint.sh && \
            chmod +x /entrypoint.sh
        ENTRYPOINT ["/entrypoint.sh"]
    environment:
      - TZ=America/Toronto
    networks:
      - local-network
    cap_add:
      - NET_ADMIN

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/prowlarr:/config
    restart: unless-stopped
    networks:
      - homelab-network

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/sonarr:/config
      - /data/media/shows:/shows
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/radarr:/config
      - /data/media/movies:/movies
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - .data/bazarr:/config
      - /data/media/movies:/movies
      - /data/media/shows:/shows
    restart: unless-stopped
    networks:
      - homelab-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8080
    volumes:
      - .data/qbittorrent:/config
      - /data/media/downloads:/downloads
    restart: unless-stopped
    networks:
      - homelab-network

  qui:
    image: ghcr.io/autobrr/qui:main
    container_name: qui
    volumes:
      - .data/qui:/config
    networks:
      - homelab-network

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest 
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Toronto
    volumes:
      - .data/jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
      - homelab-network

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_MYSQL_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: true
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - seafile-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    networks:
      - seafile-network

  seafile-redis:
    image: redis:7-alpine
    container_name: seafile-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SEAFILE_REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SEAFILE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seafile-network

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    volumes:
      - ${SEAFILE_DATA_PATH:-/data/seafile}:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: 3306
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_PASSWORD}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${SEAFILE_MYSQL_ROOT_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: America/Toronto
      INIT_SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: seafile.${CADDY_DOMAIN}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: false
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: false
      ENABLE_GO_FILESERVER: true
      ENABLE_SEADOC: true
      SEADOC_SERVER_URL: https://seafile.${CADDY_DOMAIN}/sdoc-server
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SEAFILE_REDIS_PASSWORD}
      ENABLE_NOTIFICATION_SERVER: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
    networks:
      - seafile-network
      - homelab-network

  seadoc:
    image: seafileltd/sdoc-server:2.0-latest
    container_name: seadoc
    restart: unless-stopped
    volumes:
      - .data/seadoc:/shared
    environment:
      DB_HOST: seafile-db
      DB_PORT: 3306
      DB_USER: seafile
      DB_PASSWORD: ${SEAFILE_MYSQL_PASSWORD}
      DB_NAME: seahub_db
      TIME_ZONE: America/Toronto
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY}
      NON_ROOT: false
      SEAHUB_SERVICE_URL: http://seafile
    depends_on:
      seafile-db:
        condition: service_healthy
    networks:
      - seafile-network
      - homelab-network

  keeper-postgres:
    image: postgres:17
    container_name: keeper-postgres
    environment:
      POSTGRES_USER: ${KEEPER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEEPER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KEEPER_POSTGRES_DATABASE}
    volumes:
      - keeper-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeper -d keeper"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - homelab-network

  keeper-redis:
    image: redis:7-alpine
    container_name: keeper-redis
    volumes:
      - keeper-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - homelab-network

  keeper:
    image: ghcr.io/ridafkih/keeper-services:latest
    container_name: keeper
    environment:
      DATABASE_URL: ${KEEPER_DATABASE_URL}
      REDIS_URL: ${KEEPER_REDIS_URL}
      WEBSOCKET_URL: ${KEEPER_WEBSOCKET_URL}
      BETTER_AUTH_URL: ${KEEPER_BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${KEEPER_BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${KEEPER_ENCRYPTION_KEY}
      COMMERCIAL_MODE: false
      GOOGLE_CLIENT_ID: ${KEEPER_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${KEEPER_GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${KEEPER_MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${KEEPER_MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      keeper-postgres:
        condition: service_healthy
      keeper-redis:
        condition: service_healthy
    networks:
      - homelab-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    env_file: .env
    depends_on:
      - tempo
      - loki
    networks:
      - homelab-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file", "/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    networks:
      - homelab-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks:
      - homelab-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file", "/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    networks:
      - homelab-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki
    networks:
      - homelab-network

  grafana-funnel:
    image: tailscale/tailscale:latest
    container_name: tailscale-funnel
    restart: unless-stopped
    hostname: otel-funnel
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - grafana-funnel:/var/lib/tailscale
      - ./config/tailscale-serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - homelab-network

volumes:
  seafile-database:
    driver: local
  keeper-database:
    driver: local
  keeper-redis:
    driver: local
  authentik-database:
    driver: local
  authentik-redis:
    driver: local
  tempo:
    driver: local
  prometheus:
    driver: local
  loki:
    driver: local
  grafana:
    driver: local
  grafana-funnel:
    driver: local

networks:
  seafile-network:
    driver: bridge
  authentik-network:
    driver: bridge
  homelab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  local-network:
    driver: macvlan
    driver_opts:
      parent: eno1
    ipam:
      config:
        - subnet: 192.168.2.0/24
          ip_range: 192.168.2.96/29
