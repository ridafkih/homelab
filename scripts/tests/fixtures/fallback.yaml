    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    command: ["--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"]
  dash:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN-rida.sh}
  colon-equals:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN:=rida.sh}
  equals:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN=rida.sh}
  colon-plus:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN:+rida.sh}
  plus:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN+rida.sh}
  bare:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: ${CADDY_DOMAIN}
  unbraced:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      DOMAIN: $CADDY_DOMAIN
