name: fixture-interpolated-secret

services:
  redis:
    image: docker.io/library/redis:7.4.1-alpine@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    command: ["redis-server", "--requirepass", "${SEAFILE_REDIS_PASSWORD:?}"]
  healthcheck:
    image: docker.io/library/redis:7.4.1-alpine@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
  caddy:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
  tunnel:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      TUNNEL_TOKEN: ${RIDASH_CLOUDFLARE_TUNNEL_TOKEN?required}
  unlisted:
    image: docker.io/library/busybox:1.37.0@sha256:a5d0ce49aa801d475da48f8cb163c354ab95cab073cd3c138bd458fc8257fbf1
    environment:
      ANYTHING: ${SOMETHING_NOT_IN_ANY_ENV_FILE:?}
