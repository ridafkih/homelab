# OpenSEO standalone (upstream deploy/standalone/compose.yaml from
# github.com/every-app/open-seo v0.1.19), run as its own project.
# Changes from upstream:
#   - the app image is pinned to 0.1.19 by digest;
#   - nginx publishes nothing; a Caddy sidecar terminates TLS with the
#     tailnet certificate and is the only published port, bound to the
#     tailnet IP. configure.mjs requires an https BETTER_AUTH_URL off loopback.
# Boot ordering: openseo.service (host/etc/systemd/system) runs `up -d` once
# docker and the tailnet address are up.
name: openseo
x-app: &app
  image: ${OPENSEO_IMAGE:-ghcr.io/every-app/open-seo-standalone:0.1.19@sha256:6e774cc3acb679d9aa7303a1c1851267312e828bbb5c0208dbafdcca2ba7337e}
x-storage: &storage
  CELLD_BUCKET: openseo
  S3_ENDPOINT: http://storage:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
services:
  storage:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes: [storage:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 3s
      retries: 20
  runtime:
    <<: *app
    environment:
      <<: *storage
      CELLD_MAX_RSS_MB: "1536"
      CELLD_MAX_RESIDENT_CELLS: "64"
      CELLD_V8_HEAP_LIMIT_MB: "256"
      CELLD_MAX_REQUEST_BODY_BYTES: "33554432"
      RUST_LOG: warn,cell_console=info
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    volumes: [runtime:/data, config:/config:ro]
    depends_on:
      storage: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5
  init:
    <<: *app
    command: [sh, /opt/standalone/init.sh]
    network_mode: service:runtime
    environment:
      <<: *storage
      AUTH_MODE: ${AUTH_MODE:?Set AUTH_MODE in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      CONTEXT_API_KEY: ${CONTEXT_API_KEY:-}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes: [config:/config, web-config:/web-config]
    depends_on:
      runtime: { condition: service_started }
    restart: "no"
  crawl-gateway:
    <<: *app
    command: [node, /opt/standalone/crawl-gateway.mjs]
    volumes: [config:/config:ro]
    depends_on:
      init: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - type: volume
        source: web-config
        target: /etc/nginx/conf.d
        read_only: true
        volume: { nocopy: true }
    depends_on:
      init: { condition: service_completed_successfully }
      crawl-gateway: { condition: service_started }
    restart: unless-stopped
  tls:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports: ["${BIND_ADDRESS:?Set BIND_ADDRESS in .env}:${PORT:?Set PORT in .env}:${PORT}"]
    environment:
      SITE_ADDRESS: ${BETTER_AUTH_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - tls-data:/data
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped
volumes:
  storage:
  runtime:
  config:
  web-config:
  tls-data:
